name: Sample SID truck parking occupancy

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: sid-sample
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/checkout@v4
        with:
          ref: sid-data
          path: archive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements-mobilithek.txt
      - run: python scripts/sample_sid_occupancy.py archive/samples
        env:
          MOBILITHEK_CERT_P12: ${{ secrets.MOBILITHEK_CERT_P12 }}
          MOBILITHEK_CERT_PASSWORD: ${{ secrets.MOBILITHEK_CERT_PASSWORD }}
      - name: Commit samples to the data branch
        working-directory: archive
        run: |
          git add samples
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "SID sample $(date -u +%Y-%m-%dT%H:%M)"
          git push
