name: Refresh public BNetzA charging snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write

concurrency:
  group: charging-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-charging.txt
      - run: pip install -r scripts/requirements-charging.txt
      - run: python -m unittest discover -s scripts -p 'test_bnetza*.py'
      - run: python scripts/refresh_truck_charging_de.py
      - name: Commit validated app snapshot when the source changed
        run: |
          git add client/public/data/truck-charging-de.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update public BNetzA charging snapshot'
          git push
