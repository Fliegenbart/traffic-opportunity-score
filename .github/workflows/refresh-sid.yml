name: Refresh SID occupancy profiles

on:
  workflow_dispatch:
  schedule:
    - cron: '25 5 * * *'

permissions:
  contents: write

concurrency:
  group: sid-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/checkout@v4
        with:
          ref: sid-data
          path: archive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements-mobilithek.txt
      - run: python -m unittest discover -s scripts -p 'test_sid*.py'
      - run: python scripts/refresh_sid_profile_de.py archive/samples
        env:
          MOBILITHEK_CERT_P12: ${{ secrets.MOBILITHEK_CERT_P12 }}
          MOBILITHEK_CERT_PASSWORD: ${{ secrets.MOBILITHEK_CERT_PASSWORD }}
      - name: Commit validated profiles when they changed
        run: |
          git add -A client/public/data/truck-parking-occupancy client/public/data/truck-parking-occupancy-de.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update SID occupancy profiles'
          git push
