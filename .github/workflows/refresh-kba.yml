name: Refresh KBA e-truck registrations

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 18 * *'
    - cron: '23 6 25 * *'

permissions:
  contents: write

concurrency:
  group: kba-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-kba.txt
      - run: pip install -r scripts/requirements-kba.txt
      - run: python -m unittest discover -s scripts -p 'test_kba*.py'
      - run: python scripts/refresh_kba_trucks_de.py
      - name: Commit validated KBA snapshot when the source changed
        run: |
          git add client/public/data/context/ev-trucks-de.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update KBA e-truck registrations'
          git push
